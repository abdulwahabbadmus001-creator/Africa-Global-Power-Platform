[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Keep browser API requests on the Netlify origin.
# Netlify forwards them privately to the Render FastAPI service.
[[redirects]]
  from = "/api/*"
  to = "https://africa-global-power-api.onrender.com/api/:splat"
  status = 200
  force = true

# React/Vite SPA fallback. Keep this LAST so /api/* is matched first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
